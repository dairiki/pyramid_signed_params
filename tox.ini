[tox]
minversion = 4
isolated_build = true
envlist =
    py{38,39,310,311,312,py3}{,-pyramid1,-pyjwt1}
    clean,cover
    lint

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    pypy-3: pypy3

[testenv]
download = true
deps =
    coverage[toml]
    pytest
    pyjwt1: PyJWT==1.*
    pyramid1: pyramid==1.*
depends =
    py{38,39,310,311,312,py3}: clean
    cover: py{38,39,310,311,312,py3}{,-pyramid1,-pyjwt1}
commands =
    coverage run -m pytest pyramid_signed_params

[testenv:clean]
deps = coverage[toml]
skip_install = true
commands = coverage erase

[testenv:cover]
deps = coverage[toml]
skip_install = true
commands =
    -coverage combine
    coverage report
    coverage html --fail-under=100

[testenv:lint]
skip_install = True
deps =
    build
    flake8
    twine
commands =
    flake8 pyramid_signed_params
    python -m build --sdist --outdir {envtmpdir}/dist {toxinidir}
    twine check {envtmpdir}/dist/*
